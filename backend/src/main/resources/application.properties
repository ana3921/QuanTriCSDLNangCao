spring.application.name=banking-app
spring.profiles.active=dev

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://AN:1433;databaseName=banking_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=banking_user
spring.datasource.password=an2011
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=banking_app_demo_jwt_secret_key_must_be_at_least_64_chars_long_1234567890
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.banking=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true
